# Dog-food instance (completed): mock useStructuredFeedback e2e.
#
# Acceptance landed in test/repro/mock-structured-feedback-e2e.test.ts.
# Re-run as a regression check (baseline off — the suite is already green):
#
#   npm run loopgen -- lint loops/instances/mock-structured-feedback-e2e.loop.yaml
#   npx vitest run test/repro/mock-structured-feedback-e2e.test.ts
#   npm run loopgen -- run loops/instances/mock-structured-feedback-e2e.loop.yaml -d mock
version: 1
name: mock-structured-feedback-e2e
description: Integration test — mock driver consumes feedback.evaluations details.files through LoopEngine.
task:
  type: function
stack:
  language: typescript
  packageManager: npm
workspace:
  dir: ../..
requirements: |
  Keep `test/repro/mock-structured-feedback-e2e.test.ts` green.

  The test proves this end-to-end contract:
  - A custom evaluator (`structured-gate`) fails while `answer.txt` is not `42`
    and returns `details.files: { "answer.txt": "42" }` on failure.
  - `LoopEngine` runs the `mock` driver with `useStructuredFeedback: true` and a
    single scripted step that writes `wrong` on iteration 0.
  - On iteration 1 the mock driver applies the structured fix from
    `invocation.feedback.evaluations` (not a second scripted step).
  - The loop ends `success` with `answer.txt` containing `42`.
driver:
  uses: mock
  options:
    steps: []
evaluators:
  - uses: command
    as: acceptance
    options:
      command: npx vitest run test/repro/mock-structured-feedback-e2e.test.ts
    guard:
      - test/repro/mock-structured-feedback-e2e.test.ts
  - uses: command
    as: typecheck
    options:
      command: npm run typecheck
  - uses: command
    as: regression
    options:
      command: npm test
success:
  type: all-pass
limits:
  maxIterations: 1
  iterationTimeoutMs: 1200000
  baseline: false
  specGuard: error
  evaluatorGuard: error
