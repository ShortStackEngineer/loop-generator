# Dog-food: prove LoopEngine + mock useStructuredFeedback via integration test.
#
#   npm run loopgen -- lint loops/instances/mock-structured-feedback-e2e.loop.yaml
#   npx vitest run test/repro/mock-structured-feedback-e2e.test.ts   # RED until implemented
#   npm run loopgen -- run loops/instances/mock-structured-feedback-e2e.loop.yaml
version: 1
name: mock-structured-feedback-e2e
description: Integration test — mock driver consumes feedback.evaluations details.files through LoopEngine.
task:
  type: function
stack:
  language: typescript
  packageManager: npm
workspace:
  dir: ../..
requirements: |
  Implement `test/repro/mock-structured-feedback-e2e.test.ts` so it passes.

  The test must prove this end-to-end contract on the repo root:
  - Register a custom evaluator (`structured-gate`) that fails while `answer.txt`
    is not `42` and returns `details.files: { "answer.txt": "42" }` on failure.
  - Run `LoopEngine` with the `mock` driver (`useStructuredFeedback: true`) and
    a single scripted step that writes `wrong` on iteration 0.
  - On iteration 1 the mock driver must apply the structured fix from
    `invocation.feedback.evaluations` (not a second scripted step).
  - The loop ends `success` with `answer.txt` containing `42`.

  Do not weaken assertions. Do not modify guarded test files. Keep the existing
  structured-feedback driver helpers behavior intact.
driver:
  uses: claude-agent-sdk
  options:
    model: claude-sonnet-5
    maxTurns: 20
evaluators:
  - uses: command
    as: acceptance
    options:
      command: npx vitest run test/repro/mock-structured-feedback-e2e.test.ts
    guard:
      - test/repro/mock-structured-feedback-e2e.test.ts
  - uses: command
    as: typecheck
    options:
      command: npm run typecheck
  - uses: command
    as: regression
    options:
      command: npm test
success:
  type: all-pass
limits:
  maxIterations: 6
  iterationTimeoutMs: 1200000
  baseline: strict
  specGuard: error
  evaluatorGuard: error
  maxCostUsd: 5.0
