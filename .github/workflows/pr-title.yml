name: PR title

# With squash-merge, the PR title becomes the commit message release-please
# reads — so titles must be conventional (feat:, fix:, docs:, chore:, test:,
# refactor:, ci:, build:, perf:, revert:).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
