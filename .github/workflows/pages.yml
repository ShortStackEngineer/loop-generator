name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
    paths: ["site/**", "course/**", "src/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            course/package-lock.json
      # Root deps first: the course imports engine source from ../src (zod, yaml
      # resolve from the root node_modules), so both installs are required.
      - run: npm ci
      - run: npm ci
        working-directory: course
      - run: npm run build
        working-directory: course
      - name: Assemble site (docs + workshop at /course/)
        run: |
          mkdir -p _site
          cp -r site/* _site/
          cp -r course/dist _site/course
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
