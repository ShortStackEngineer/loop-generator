name: Mutation testing

# Stryker is too slow for per-PR CI; it gates asynchronously — nightly on
# master, or on demand. Thresholds live in stryker.config (break: fails the run).
on:
  schedule:
    - cron: "17 4 * * *" # nightly, 04:17 UTC
  workflow_dispatch:

concurrency:
  group: mutation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation:
    name: Stryker mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mutation
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
