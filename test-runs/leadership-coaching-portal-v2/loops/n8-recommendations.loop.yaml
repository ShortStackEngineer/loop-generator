version: 1
name: n8-recommendations
description: Book/podcast recommendations (outcome-only).
task:
  type: api
stack:
  language: typescript
  framework: express
  packageManager: npm
workspace:
  dir: ../app
  snapshot: git
  ignore: ["data/**", "node_modules/**", "dist/**"]
requirements: |
  Coaches recommend resources to a client (books, podcasts, and a generic
  "other" kind) with optional URL and notes. Invalid kinds are rejected as
  client errors. Portal users must not add recommendations via coach tools.

  Pass `npm run test:n8` and typecheck. Do not edit tests.
driver:
  uses: grok
  options:
    maxTurns: 40
    alwaysApprove: true
evaluators:
  - uses: command
    as: tests
    options:
      command: npm run test:n8
      timeoutMs: 120000
    guard:
      - test/acceptance/n1-coach-auth.test.ts
      - test/acceptance/n2-create-client.test.ts
      - test/acceptance/n8-recommendations.test.ts
      - test/helpers.ts
  - uses: command
    as: typecheck
    options:
      command: npm run typecheck
success:
  type: all-pass
limits:
  maxIterations: 8
  iterationTimeoutMs: 1200000
  baseline: strict
  evaluatorGuard: error
evaluation:
  concurrency: 1
